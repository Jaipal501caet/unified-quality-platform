name: Kubernetes Orchestration Pipeline

on:
  push:
    branches: [ main ]
    # 🟢 CHANGE: Only trigger if files in 'k8s/' folder or this workflow file change
    paths:
      - 'k8s/**'
      - '.github/workflows/kubernetes.yml'
  
  workflow_dispatch: # Keep the manual button too!

jobs:
  # ==================================================================
  # STAGE 1: Playwright on Kubernetes
  # ==================================================================
  k8s-ui-test:
    name: ☸️ UI Tests (Minikube)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Start Kubernetes Environment
      - name: ☸️ Start Minikube
        uses: medyagh/setup-minikube@master

      # 2. Deploy Job (Updated with Sleep Logic)
      - name: 🔥 Run K6 Job
        run: |
          kubectl apply -f k8s/k6-job.yaml
          
          echo "Waiting for Load Test to complete..."
          
          # 🟢 FIX: Loop until we see 'K6_FINISHED' in the logs
          timeout 300s bash -c 'until kubectl logs job/k6-job --tail=50 --all-containers=true 2>/dev/null | grep -q "K6_FINISHED"; do sleep 5; done'
          
          echo "K6 finished! Pod is sleeping for copy..."

      # 3. Extract Report (From the first available pod)
      - name: 📦 Extract Performance Report
        if: always()
        run: |
          # 🟢 FIX: 'head -n 1' ensures we only grab ONE pod name if multiple exist (due to parallelism)
          POD_NAME=$(kubectl get pods --selector=job-name=k6-job -o jsonpath='{.items[*].metadata.name}' | awk '{print $1}')
          
          echo "Copying report from Pod: $POD_NAME"
          
          # Copy file
          kubectl cp $POD_NAME:/app/src/test-results ./src/test-results
          
          # Clean up
          kubectl delete job k6-job || true

      - name: 📤 Upload K6 Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k8s-k6-report
          path: src/test-results/
      # 4. Extract Reports (Now works because Pod is still 'Running' in sleep mode)
      - name: 📦 Extract UI Reports
        if: always()
        run: |
          POD_NAME=$(kubectl get pods --selector=job-name=playwright-job -o jsonpath='{.items[0].metadata.name}')
          
          # Copy now!
          kubectl cp $POD_NAME:/app/test-results ./test-results
          
          # Optional: Now we can manually kill the job since we have the data
          kubectl delete job playwright-job || true

      - name: 📤 Upload UI Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k8s-playwright-report
          path: test-results/
          retention-days: 30

  # ==================================================================
  # STAGE 2: K6 on Kubernetes
  # ==================================================================
  k8s-load-test:
    name: ☸️ K6 Load Test (Minikube)
    needs: k8s-ui-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: ☸️ Start Minikube
        uses: medyagh/setup-minikube@master

      # 1. Build K6 Image
      - name: 🐳 Build K6 Image
        run: |
          echo "FROM grafana/k6:latest" > Dockerfile.k6
          echo "COPY . /app" >> Dockerfile.k6
          echo "WORKDIR /app" >> Dockerfile.k6
          
          eval $(minikube docker-env)
          docker build -t k6-image:latest -f Dockerfile.k6 .

      # 2. Deploy Job
      - name: 🔥 Run K6 Job
        run: |
          kubectl apply -f k8s/k6-job.yaml
          
          echo "Waiting for Load Test to complete..."
          kubectl wait --for=condition=complete --timeout=300s job/k6-job || (kubectl logs job/k6-job && exit 1)

      - name: 📦 Extract Performance Report
        if: always()
        run: |
          POD_NAME=$(kubectl get pods --selector=job-name=k6-job -o jsonpath='{.items[0].metadata.name}')
          # Note: We use the simplified path '/app/src/test-results' based on our Dockerfile structure
          kubectl cp $POD_NAME:/app/src/test-results ./src/test-results

      - name: 📤 Upload K6 Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k8s-k6-report
          path: src/test-results/
