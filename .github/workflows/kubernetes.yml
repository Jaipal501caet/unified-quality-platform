name: ☸️ Kubernetes Orchestration Pipeline

on:
  push:
    branches: [ main ]
    # Only trigger if K8s files change (Smart Trigger)
    paths:
      - 'k8s/**'
      - '.github/workflows/kubernetes.yml'
  
  workflow_dispatch: # Manual Button

jobs:
  # ==================================================================
  # STAGE 1: Playwright on Kubernetes
  # ==================================================================
  k8s-ui-test:
    name: ☸️ UI Tests (Minikube)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: ☸️ Start Minikube
        uses: medyagh/setup-minikube@master

      # 1. Build Playwright Image (Using v1.57.0 to match package.json)
      - name: 🐳 Build UI Image
        run: |
          echo "FROM mcr.microsoft.com/playwright:v1.57.0-jammy" > Dockerfile.ui
          echo "WORKDIR /app" >> Dockerfile.ui
          echo "COPY . ." >> Dockerfile.ui
          echo "RUN npm install" >> Dockerfile.ui
          
          eval $(minikube docker-env)
          docker build -t e2e-image:latest -f Dockerfile.ui .

      # 2. Run Job & Verify Parallelism
      - name: 🚀 Run Playwright Job
        run: |
          kubectl apply -f k8s/playwright-job.yaml
          
          echo "Waiting for pods to initialize..."
          sleep 10
          
          # 🟢 PROOF OF PARALLELISM (Interview Feature)
          echo "--- 🔍 PROOF OF PARALLELISM ---"
          kubectl get pods --selector=job-name=playwright-job -o wide
          echo "---------------------------------"

          echo "Waiting for tests to finish processing..."
          # Wait for log signal 'TESTS_FINISHED'
          timeout 300s bash -c 'until kubectl logs job/playwright-job --tail=50 --all-containers=true 2>/dev/null | grep -q "TESTS_FINISHED"; do sleep 5; done'
          
          echo "Tests finished! Pod is sleeping for copy..."

      # 3. Extract UI Reports
      - name: 📦 Extract UI Reports
        if: always()
        run: |
          # Get the first pod name (handles parallelism)
          POD_NAME=$(kubectl get pods --selector=job-name=playwright-job -o jsonpath='{.items[*].metadata.name}' | awk '{print $1}')
          
          kubectl cp $POD_NAME:/app/test-results ./test-results
          
          # Cleanup
          kubectl delete job playwright-job || true

      - name: 📤 Upload UI Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k8s-playwright-report
          path: test-results/
          retention-days: 30

  # ==================================================================
  # STAGE 2: K6 on Kubernetes
  # ==================================================================
  k8s-load-test:
    name: ☸️ K6 Load Test (Minikube)
    needs: k8s-ui-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: ☸️ Start Minikube
        uses: medyagh/setup-minikube@master

      # 1. Build K6 Image
      - name: 🐳 Build K6 Image
        run: |
          echo "FROM grafana/k6:latest" > Dockerfile.k6
          echo "COPY . /app" >> Dockerfile.k6
          echo "WORKDIR /app" >> Dockerfile.k6
          
          eval $(minikube docker-env)
          docker build -t k6-image:latest -f Dockerfile.k6 .

      # 2. Run Job & Verify Scaling
      - name: 🔥 Run K6 Job
        run: |
          kubectl apply -f k8s/k6-job.yaml
          
          echo "Waiting for pods to initialize..."
          sleep 10
          
          # 🟢 PROOF OF SCALING (Interview Feature)
          echo "--- 🔍 PROOF OF SCALING ---"
          kubectl get pods --selector=job-name=k6-job -o wide
          echo "---------------------------"

          echo "Waiting for Load Test to complete..."
          # Wait for log signal 'K6_FINISHED'
          timeout 300s bash -c 'until kubectl logs job/k6-job --tail=50 --all-containers=true 2>/dev/null | grep -q "K6_FINISHED"; do sleep 5; done'
          
          echo "K6 finished! Pod is sleeping for copy..."

      # 3. Extract Performance Report
      - name: 📦 Extract Performance Report
        if: always()
        run: |
          # Get the first pod name (handles parallelism)
          POD_NAME=$(kubectl get pods --selector=job-name=k6-job -o jsonpath='{.items[*].metadata.name}' | awk '{print $1}')
          
          echo "Copying report from Pod: $POD_NAME"
          kubectl cp $POD_NAME:/app/src/test-results ./src/test-results
          
          # Cleanup
          kubectl delete job k6-job || true

      - name: 📤 Upload K6 Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k8s-k6-report
          path: src/test-results/
